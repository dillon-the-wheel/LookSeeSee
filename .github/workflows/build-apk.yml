name: Build Debug APK

# Builds the app on GitHub's own servers (unrestricted internet access),
# so you can download a working APK without needing Gradle/Android Studio
# to successfully build anything on your own machine.
on:
  push:
    branches:
      - claude/android-dev-claude-code-ai1h8l
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: look-see-see-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
